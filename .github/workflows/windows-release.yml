name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64 binaries
        run: |
          rustup default stable
          cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
      - name: Test Rust workspace
        run: |
          cargo test --workspace --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
      - name: Package portable app
        run: ./scripts/package_windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaged simulator DLL
        run: |
          python -m pip install requests
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          python scripts/smoke_release.py dist/SimRoki-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Packaged simulator smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SimRoki-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Apple Silicon binaries
        run: |
          test "$(uname -m)" = arm64
          rustup default stable
          cargo build --workspace --release --locked
          cargo test --workspace --release --locked
      - name: Package native application
        run: python3 scripts/package_macos.py --version "${{ github.ref_name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaged simulator library
        run: |
          python -m pip install requests
          python scripts/smoke_release.py dist/SimRoki-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SimRoki-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SimRoki-*
          path: dist
          merge-multiple: true
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, repo);
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) {
              throw new Error('Release is already published; refusing to replace assets.');
            }
            const body = fs.readFileSync('docs/release-notes.md', 'utf8') + `\n\nSource commit: ${context.sha}`;
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: `SimRoki ${tag} — RABBIT walking`,
                body, draft: true, prerelease: false
              })).data;
            }
            for (const name of ['SimRoki-windows-x64.zip', 'SimRoki-windows-x64.zip.sha256', 'SimRoki-macos-arm64.zip', 'SimRoki-macos-arm64.zip.sha256']) {
              const data = fs.readFileSync(`dist/${name}`);
              const existing = release.assets.find(a => a.name === name);
              if (existing) throw new Error(`Draft already contains ${name}; inspect before retrying.`);
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
            await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, body, draft: false, make_latest: 'true'
            });
            core.info(release.html_url);
